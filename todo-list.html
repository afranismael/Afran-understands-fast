<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Afran's To-Do List - Task Manager</title>
    <link rel="stylesheet" href="todo-styles.css">
</head>
<body>
    <div class="container">
        <!-- Header -->
        <div class="header">
            <div class="header-content">
                <h1 class="title">Task Mind</h1>
                <p class="subtitle">Organize your thoughts. Master your tasks.</p>
            </div>
        </div>

        <!-- Main Todo Container -->
        <div class="todo-container glass-effect">
            <!-- Input Section -->
            <div class="input-section">
                <div class="input-wrapper">
                    <input 
                        type="text" 
                        id="todoInput" 
                        class="todo-input" 
                        placeholder="Add a new task..."
                        autocomplete="off"
                    >
                    <button id="addBtn" class="add-button">Add Task</button>
                </div>
                <div class="filter-buttons">
                    <button class="filter-btn active" data-filter="all">All</button>
                    <button class="filter-btn" data-filter="active">Active</button>
                    <button class="filter-btn" data-filter="completed">Completed</button>
                </div>
            </div>

            <!-- Stats Section -->
            <div class="stats-section">
                <div class="stat-item">
                    <span class="stat-label">Total Tasks</span>
                    <span class="stat-value" id="totalTasks">0</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label">Completed</span>
                    <span class="stat-value" id="completedTasks">0</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label">Remaining</span>
                    <span class="stat-value" id="remainingTasks">0</span>
                </div>
            </div>

            <!-- Todo List -->
            <div class="todo-list-wrapper">
                <ul id="todoList" class="todo-list">
                    <!-- Todos will be added here -->
                </ul>
                <div id="emptyState" class="empty-state">
                    <div class="empty-icon">✨</div>
                    <p>No tasks yet. Add one to get started!</p>
                </div>
            </div>

            <!-- Action Buttons -->
            <div class="action-buttons">
                <button id="clearCompleted" class="action-btn clear-btn" title="Clear completed tasks">Clear Completed</button>
                <button id="clearAll" class="action-btn danger-btn" title="Delete all tasks">Delete All</button>
            </div>
        </div>

        <!-- Motivation Quote -->
        <div class="motivation-section">
            <p id="motivationQuote" class="motivation-text"></p>
        </div>
    </div>

    <script src="todo-script.js"></script>
</body>
</html>
